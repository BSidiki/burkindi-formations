# Démarrage en local : uniquement PostgreSQL et Redis. L'API et le site tournent avec `npm run dev`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: burkindi
      POSTGRES_PASSWORD: burkindi_local
      POSTGRES_DB: burkindi
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata_local:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burkindi -d burkindi"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

volumes: { pgdata_local: {} }
