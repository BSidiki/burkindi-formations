upstream api_up { server 127.0.0.1:4000; }
upstream web_up { server 127.0.0.1:3000; }
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
  listen 80;
  server_name example.com;
  location /api/ { proxy_pass http://api_up/; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /socket.io/ { proxy_pass http://api_up; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /admin-portal/login { limit_req zone=login burst=3 nodelay; proxy_pass http://web_up; proxy_set_header X-Real-IP $remote_addr; }
  location / { proxy_pass http://web_up; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
}
